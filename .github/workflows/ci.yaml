name: Go CI

on:
  push:
    branches:
      - '*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run linter
        run: |
          go vet ./...
          go fmt ./...
          $(go env GOPATH)/bin/golangci-lint run
