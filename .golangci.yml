run:
  go: '1.24'
  timeout: 5m
  allow-parallel-runners: true
  
linters:
  disable-all: true
  enable:
    # Basic linters
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - misspell
    
    # Code complexity
    - gocyclo
    - dupl
    - goconst
    - goimports
    
    # Bug prevention
    - bodyclose
    - revive
    - prealloc
    - unconvert
    - unparam
    - gocritic
    
    # Style and documentation
    - godot
    - whitespace
    - wsl
    - nolintlint
    
    # Architecture
    - gochecknoinits
    - gochecknoglobals
    
    # Security
    - gosec
    
    # Additional quality checks
    - stylecheck
    - nakedret
    - dogsled
    - nestif
    - tparallel
    - thelper
    - forbidigo
    - nilnil
    - contextcheck
    - errorlint

linters-settings:
  gocyclo:
    min-complexity: 10
  dupl:
    threshold: 100
  goconst:
    min-len: 3
    min-occurrences: 3
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: unexported-return
        severity: warning
      - name: if-return
        severity: warning
      - name: increment-decrement
        severity: warning
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
  nestif:
    min-complexity: 4
  forbidigo:
    forbid:
      - ^fmt\.Print.*$
      - ^log\..*$
      - ^panic$
      - ^os\.Exit$
  errorlint:
    errorf: true
    asserts: true
    comparison: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - dupl
        - gocyclo
    - path: internal/domain/
      linters:
        - gochecknoglobals
    - path: cmd/
      linters:
        - gochecknoinits
  exclude-dirs:
    - ent/
    - tmp/
    - vendor/
    - mocks/
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
  new: true
  new-from-rev: HEAD~1

output:
  sort-results: true
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true